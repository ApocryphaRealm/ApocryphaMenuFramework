; Apocrypha Menu Framework theme - Vel'dun.
; Made to sit beside Vel'dun UI (Nithog, Nexus 176230): its bone line colour, warm dark panel and tan
; headings, taken from Vel'dun UI's own ImGui style. The art (assets/*/veldun.png) was drawn for AMF; no files
; from Vel'dun UI are included, and Vel'dun UI is not required.
[Theme]
sName=Vel'dun
sBackground=#1D1A17
sFrame=#D1C7AE
sBorder=#D1C7AE
sText=#E4DDCC
sTextDim=#A39C8A
sAccent=#AAA07A
; 2.1.5 text roles on the pages AMF builds from MCM menus: section headings, and help / info text
sTextHeader=#CDBF8E
sTextHelp=#A8B9B5
fBorderThickness=1.0
bKnotwork=0
; 2.1.6: the theme's art parts, by name, from assets/frames, assets/backgrounds and assets/toggles
sFrameArt=veldun
sBackgroundArt=grain
sToggleArt=veldun
; 2.1.6: the switch knob, made from the theme's section-line end piece (assets/knobs)
sKnobArt=veldun
; 2.1.6: the rest of the theme's own parts - its namesakes in every kind, so "Theme's own" on Appearance > Art is
; the same look as picking this theme's name there (the owner: the theme's own section lines differed from its namesake)
sBoxArt=veldun
sButtonArt=veldun
sTickBoxArt=veldun
sSliderArt=veldun
sScrollbarArt=veldun
sSectionArt=veldun
sTabArt=veldun
sArrowArt=veldun
sCursorArt=veldun
sSliderTrackArt=veldun
sScrollTrackArt=veldun
