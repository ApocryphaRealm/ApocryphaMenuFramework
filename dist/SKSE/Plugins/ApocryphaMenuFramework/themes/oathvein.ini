; Apocrypha Menu Framework theme - Oathvein.
; Made to sit beside Oathvein UI (Nithog, Nexus 160916): its charcoal panels, thin grey lines and
; blood-red highlight, colours sampled from Oathvein UI's own screens. The art (assets/*/oathvein.png) was drawn
; for AMF; no files from Oathvein UI are included, and Oathvein UI is not required.
[Theme]
sName=Oathvein
sBackground=#191919
sFrame=#A6A8A7
sBorder=#A6A8A7
sText=#E8E8E8
sTextDim=#8C8C8C
sAccent=#8E2A2E
; 2.1.5 text roles on the pages AMF builds from MCM menus: section headings, and help / info text
sTextHeader=#C8686C
sTextHelp=#A8AEB5
fBorderThickness=1.0
bKnotwork=0
; 2.1.6: the theme's art parts, by name, from assets/frames and assets/toggles
sFrameArt=oathvein
; no background art: the plain panel colour (2.1.6, the owner: every theme but Oblivion has the plain background)
sToggleArt=oathvein
; 2.1.6: the switch knob, made from the theme's section-line end piece (assets/knobs)
sKnobArt=oathvein
; 2.1.6: the rest of the theme's own parts - its namesakes in every kind, so "Theme's own" on Appearance > Art is
; the same look as picking this theme's name there (the owner: the theme's own section lines differed from its namesake)
sBoxArt=oathvein
sButtonArt=oathvein
sTickBoxArt=oathvein
sSliderArt=oathvein
sScrollbarArt=oathvein
sSectionArt=oathvein
sTabArt=oathvein
sArrowArt=oathvein
sCursorArt=oathvein
sSliderTrackArt=oathvein
sScrollTrackArt=oathvein
