; Apocrypha Menu Framework theme - Norden.
; Made to sit beside Norden UI (Nithog, Nexus 166086): its #333333 panels, silver-grey lines and
; highlights and bright corner ticks, colours taken from Norden UI's own menus. The art (assets/*/norden.png) was
; drawn for AMF; no files from Norden UI are included, and Norden UI is not required.
[Theme]
sName=Norden
sBackground=#333333
sFrame=#BBBDBF
sBorder=#8E9396
sText=#E5E5E5
sTextDim=#999999
sAccent=#BBBDBF
; 2.1.5 text roles on the pages AMF builds from MCM menus: section headings, and help / info text
sTextHeader=#C9D6E3
sTextHelp=#8FB3CF
fBorderThickness=1.0
bKnotwork=0
; 2.1.6: the theme's art parts, by name, from assets/frames and assets/toggles
sFrameArt=norden
; no background art: the plain panel colour (2.1.6, the owner: every theme but Oblivion has the plain background)
sToggleArt=norden
; 2.1.6: the switch knob, made from the theme's section-line end piece (assets/knobs)
sKnobArt=norden
; 2.1.6: the rest of the theme's own parts - its namesakes in every kind, so "Theme's own" on Appearance > Art is
; the same look as picking this theme's name there (the owner: the theme's own section lines differed from its namesake)
sBoxArt=norden
sButtonArt=norden
sTickBoxArt=norden
sSliderArt=norden
sScrollbarArt=norden
sSectionArt=norden
sTabArt=norden
sArrowArt=norden
sCursorArt=norden
sSliderTrackArt=norden
sScrollTrackArt=norden
