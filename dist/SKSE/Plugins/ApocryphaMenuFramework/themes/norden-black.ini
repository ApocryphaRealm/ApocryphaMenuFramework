; Apocrypha Menu Framework theme - Norden - Black.
; Norden with its panel grey taken to black, the same rule as our Norden UI - Black recolour: the
; #333333 panel becomes black, lines, text and highlights stay Norden's. Uses the Norden art parts (assets/*/norden.png).
[Theme]
sName=Norden - Black
sBackground=#000000
sFrame=#BBBDBF
sBorder=#8E9396
sText=#E5E5E5
sTextDim=#999999
sAccent=#BBBDBF
; 2.1.5 text roles on the pages AMF builds from MCM menus: section headings, and help / info text
sTextHeader=#C9D6E3
sTextHelp=#8FB3CF
fBorderThickness=1.0
bKnotwork=0
; 2.1.6: the theme's art parts, by name, from assets/frames, assets/backgrounds and assets/toggles
sFrameArt=norden
sBackgroundArt=grain
sToggleArt=norden
; 2.1.6: the switch knob, made from the theme's section-line end piece (assets/knobs)
sKnobArt=norden
; 2.1.6: the rest of the theme's own parts - its namesakes in every kind, so "Theme's own" on Appearance > Art is
; the same look as picking this theme's name there (the owner: the theme's own section lines differed from its namesake)
sBoxArt=norden
sButtonArt=norden
sTickBoxArt=norden
sSliderArt=norden
sScrollbarArt=norden
sSectionArt=norden
sTabArt=norden
sArrowArt=norden
sCursorArt=norden
sSliderTrackArt=norden
sScrollTrackArt=norden
