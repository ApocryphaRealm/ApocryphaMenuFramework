; Apocrypha Menu Framework theme - Oblivion.
; The look of Apocrypha Menu Framework for Oblivion Remastered, brought to Skyrim (2.1.6, the owner: "import the
; oblivion theme"): brown ink on a parchment ground with brass accents - the Oblivion paper-menu palette as plain
; colours - framed by an embroidered map's edge in gold and brown. The frame is original art drawn for AMF from
; shapes; no game files are included.
[Theme]
sName=Oblivion
sBackground=#E4DBCC
sFrame=#241C16
sBorder=#6B563F
sText=#2A1C12
sTextDim=#6F5D4C
sAccent=#8A6A2C
; 2.1.6 text roles on the pages AMF builds from MCM menus: section headings, and help / info text
sTextHeader=#7A3B1E
sTextHelp=#4E5F72
fBorderThickness=1.0
bKnotwork=0
; the theme's art parts, by name: the map-edge frame (it tiles its stitched edges), a parchment ground and a
; scroll-shaped switch
sFrameArt=oblivion-map-edge
sBackgroundArt=parchment
sToggleArt=oblivion-scroll
