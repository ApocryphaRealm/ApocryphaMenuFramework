; Apocrypha Menu Framework theme - Nordic (DRAFT for review).
; A translucent black slab with no outline, only a Greek-key ornament in each corner (NORDIC UI's own corner art,
; by outobugi, used with credit under its open permissions), pointed banner-plate controls, diamond knobs and a
; twisted-rope section line. Evidence: 4. plans/amf-ui-themes/nordic-ui/DESIGN.md (outside the repo).
[Theme]
sName=Nordic
sBackground=#000000F2
sFrame=#DEDEDE
sBorder=#999999
sText=#FFFFFF
sTextDim=#7A7A7A
sAccent=#E4D2B3
sTextHeader=#DDDDDD
sTextHelp=#999999
fBorderThickness=1.0
bKnotwork=0
; the theme's own art parts, by name - its namesake in every kind
sFrameArt=nordic
; no background art: the plain panel colour
sToggleArt=nordic
sKnobArt=nordic
sBoxArt=nordic
sButtonArt=nordic
sTickBoxArt=nordic
sSliderArt=nordic
sScrollbarArt=nordic
sSectionArt=nordic
sTabArt=nordic
