; Apocrypha Menu Framework - settings. Rewritten by the in-game settings page;
; edits made here while the game is closed are honoured on the next load.

[Input]
; DirectInput scan code that toggles the framework menu. 59 (0x3B) = F1.
uToggleKey=59
; 0 = keyboard navigation, 1 = controller navigation. Explicit by design - never
; auto-detected from the last-used device, which is what causes nav focus drift.
bControllerMode=0

[Display]
; Extra text scale on top of the automatic resolution scaling.
fTextScale=1.3
; Window position preset. 0 = centre. Preset anchors, not free placement.
uWindowPreset=0

[Log]
; 0 = trace (most comprehensive, the project default) ... 6 = off.
uLogLevel=0
