; ============================================================================
; ApocryphaRealm Menu Framework - settings.
;
; TWO WAYS IN, both on by default; use whichever suits you and turn the other
; off. There is one build and one INI - no installer choice to get wrong and no
; reinstall needed to change your mind.
;
;   1. THE GAME'S OWN MENU. Open the journal, go to the System tab, and pick
;      SKSE MENUS, next to SAVE, LOAD and SETTINGS. Opened that way the
;      framework is sized to the journal panel around it, so it reads as a page
;      of that menu. The row is added to the menu as it opens rather than by
;      replacing any game file, so it sits inside whatever menu artwork you
;      already have installed - vanilla, Untarnished UI, Dear Diary or any
;      other - and needs no patch for any of them. bSystemMenuRow=0 turns it
;      off and leaves the game's menu completely untouched.
;
;   2. F1, which opens the framework as its own centred window without pausing
;      into the journal first. uToggleKey=0 gives the key back to the game.
;      (A menu launcher such as Risa's All In One Menu turns this key off by
;      itself while it is installed, because it owns the menu key at that
;      point. It does not edit this file.)
;
; WHERE YOUR SETTINGS GO. This file holds the defaults and is never written.
; Settings you change in the menu are saved to
; SKSE\Plugins\ApocryphaMenuFramework\User.ini, which holds only what you
; changed and wins over this file. To set something by hand, edit User.ini - or
; this file, for anything you have not changed in the menu. Delete User.ini to
; go back to these defaults. The log says which file each setting came from.
; ============================================================================

[Menus]
; 1 = add a SKSE MENUS row to the game's own System menu (the pause menu), next to SAVE, LOAD
; and SETTINGS, so mod settings are reached where you already look for settings. The row is
; added to the menu as it opens rather than by replacing any of the game's files, so it works
; alongside menu-artwork mods instead of fighting them for the same file.
; 0 leaves the game's menu completely untouched.
bSystemMenuRow=1

[MCM]
; 1 = show every MCM Helper mod's menu (Data/MCM/Config/<mod>/config.json) as a
; page here as well, read from that mod's own files. Changes go through MCM Helper, exactly
; as its own menu makes them. 0 = leave MCM Helper menus to SkyUI only.
bLoadMcmHelperConfigs=1
; 1 = also show every SkyUI menu written only in its mod's own script (no MCM
; Helper files) as a page here. This menu makes the same calls on that script as SkyUI's
; menu does. 0 = leave those menus to SkyUI only.
bLoadSkyUIScriptMenus=1
; 1 = every MCM menu found comes into this menu unless you switched it off in the list on the settings
; page; 0 = only the menus you switch on there (good for long lists). Your choices per menu are in
; ApocryphaMenuFramework\McmImport.txt.
bImportNewMenus=1
; 1 = once a change on an MCM Helper or Prisma page has settled (a slider let go), the mod is told to apply it
; while its page stays open, as when the page is closed - so a mod such as TrueHUD changes as you set it.
; 0 = such mods apply a change only when you leave their page or close this menu.
bLiveApply=1
; 1 = take the mods this menu draws in full out of SkyUI's own MCM list, so each one is
; set in one place. A mod with anything this menu cannot draw stays in SkyUI's list. 0 = leave
; SkyUI's list as it is. The list is kept in your save: to get every menu back in SkyUI without
; this mod, type  setstage SKI_ConfigManagerInstance 1  in the console.
bHideInSkyUI=0
; Spacing on converted MCM pages, in percent of the text size: the gap between the two columns (0-200) and the
; extra space between rows (0-100).
uColumnGap=75
uRowSpacing=20

[ListFilter]
; The Mods row's Filter words, kept between games: each is +word (show only rows with it), -word (hide rows with
; it) or 0word (kept, not in use), split by ';'. bMatchAll=1: a row needs every + word; 0: any one of them.
sWords=
bMatchAll=0

; Your own colours (Appearance > Colours) are kept PER THEME, each theme like a preset you have changed: one
; [Colors.<theme id>] section per theme (skyrim, untarnished, oathvein, veldun, norden, norden-black), written to your
; User.ini as you pick them - #RRGGBB per key: sBackground sBorder sArt sBoxes sText sTextDim sAccent sSlider sSwitchOn
; sSwitchOff sHeading sHelp sHover. A key left out is that theme's own colour; sArt tints its frame and background art.

[RememberedSettings]
; Remembered MCM settings: AMF remembers MCM settings and sets them again on a new game. A new game forgets what SkyUI menus written in a mod's script, and MCM Helper
; settings kept in a global or a script property, were set to (MCM Helper's own INI settings it
; already keeps). 1 = remember each such change made in this menu, in the profile below.
bAutoBackup=1
; 1 = after a NEW game (not a loaded save), set those menus to the profile again once they appear.
bRestoreOnNewGame=1
; The profile in use: SKSE\Plugins\ApocryphaMenuFramework\RememberedSettings\<name>.json.
sProfile=Default

[Input]
; DirectInput scan code that toggles the framework menu, decimal or hex: 59 (0x3B) = F1.
; 0 = no key at all, which is the way to leave F1 entirely to the game. The same key as
; Controls > Open and close the menu; a code no key can have falls back to F1.
uToggleKey=59
; 1 = the on-screen keyboard for controller players: highlight a text box and press A,
; and a key grid appears across the bottom of the screen; the D-pad walks it, A types,
; B goes back to the box. 0 turns it off.
bOnScreenKeyboard=1
; 2.3.0: the same keyboard also types into the GAME's own text boxes (SkyUI's item and spell search,
; the map's location finder, the enchanting name box, SkyUI's MCM text boxes, other menus' prompts).
bKeyboardGameFields=1
; 1 = it opens by itself when one of those boxes starts taking text. 0 = only the open button or Up.
bKeyboardAutoOpen=1
; 1 = also with keyboard and mouse. 0 (the default) = only while you are on a controller.
bKeyboardWithMouse=0
; Which game boxes it types into (1 = yes):
bKeyboardItemSearch=1
bKeyboardMapSearch=1
bKeyboardEnchantName=1
bKeyboardMcmDialog=1
bKeyboardOtherPrompts=1
; 1 = in an item or spell list, Up on the first row moves to the search box and opens the keyboard.
bKeyboardUpOpensSearch=1
; The pad button that opens the keyboard on a menu's search box (item and spell lists) or the map's
; location finder, as an XInput mask: 64 (0x0040) = L3 (the default), 128 = R3, 32 = Back, 0 = none.
iKeyboardOpenPad=64
; Layout: auto (follows the game's language), en, de, fr, es, it, pl, cs, ru, ja, ko. LB / RB change it.
sKeyboardLayout=auto
; Size of the keyboard (0.50-2.00) and where it sits: 0 = bottom of the screen, 1 = top.
fKeyboardScale=1.00
iKeyboardPosition=0
; Keyboard or controller navigation is DETECTED from whatever you last used, and is
; not a setting: press a key or move the mouse for keyboard navigation, touch the
; pad for controller navigation. The menu shows which one it is reading.

[FLICK]
; 1 = mods written for FLICK (FUCK.dll) show their settings page in this menu, with " (FLICK)" after
; the name, and are reached only through it. 0 = leave FLICK mods alone. Applies after a restart.
bHost=1

[Prisma]
; Mods with a Prisma MCM Redux menu show it in this menu, with " (Prisma)" after the name.
; 0 = both: here and in Prisma MCM Redux's own window. 1 = here only: Prisma MCM Redux's own key
; is switched off (from the next game start) and put back when this changes. 2 = Prisma only:
; nothing of Prisma's is listed here.
iControl=0

[Menu]
; 1 = pause the game while this menu is open, the way the game's own menus do:
; world time, actors and weather stop until it closes. 0 (the default) leaves the
; game running behind it.
bPauseGame=0
; Keep the camera awake: 1 (the default) = while this menu is open and the game is not paused, the
; idle camera never starts circling your character. 0 = it does, as the game decides.
bKeepCameraAwake=1
; How fast the mouse moves the menu's pointer (0.25-4.00). 1.00 (the default) moves it exactly as fast
; as the game's own menu cursor, at any screen size, following the game's own fMouseCursorSpeed.
fPointerSpeed=1.0
; 1 = the mouse wheel over a mod's tabs steps to the previous / next tab (the default). 0 = it does not.
bWheelSwitchesTabs=1

[Display]
; Extra text scale on top of the automatic resolution scaling.
fTextScale=1.3
; See-through window (0/1): on, uWindowOpacity below fades the menu's background (100 = solid, the
; default). Off: the background is always solid.
bSeeThrough=1
; How solid the menu is, in percent (5-100): 100 is solid, lower lets the game show through. The black
; background fades by the full amount, boxes and borders much less, text least; right-click menus stay solid.
uWindowOpacity=100
; Help bar (0/1): on, the highlighted option's help on a converted MCM page shows in a bar under the
; right pane, inside the menu. Off: it shows as a popup beside the option. On is the default.
bHelpBar=1
; Appearance > Colours (0/1): on, a colour you pick changes the whole menu at once. Off: picks show only in the
; page's preview until you press Apply, beside the switch. Off is the default.
bColorsApplyNow=0
; The Mods row's Fold switch (0/1): switched on it folds every separator, off opens them all. It acts only when
; switched - a separator folded or opened by hand afterwards stays as it is.
bFoldAllSeparators=0
; Optional .ttf to rasterise the menu text from. Empty = a clean system font.
sFontPath=
; Language of the framework's own text: empty = the game's language; or a translation
; file's name - english, german, french, spanish, italian, russian, polish, czech,
; japanese, chinese (Interface/Translations/ApocryphaMenuFramework_<language>.txt).
sLanguage=
; Window position preset. 0 = centre. Preset anchors, not free placement.
uWindowPreset=0

[Window]
; Where each way of opening the menu leaves it, as FRACTIONS of the screen so the
; numbers stay right at any resolution. -1 means the player has never moved that
; window, so it takes its default: the journal panel it is hosted in when opened
; from the System row, and the centre of the screen when opened by the key. Move or
; resize either one and it is remembered here; the settings page can reset it.
; Move style: 0 = Anywhere (drag the top row or any empty part of the menu), 1 = Top edge (drag only the
; top row - the name and version), 2 = Fixed (the menu stays where it is: no moving, no resizing).
; It opens where it was left. Top edge is the default. Replaces bMovable (bMovable=0 is read as Fixed).
uMoveStyle=1
; Resize the window (0/1): on, drag any edge or corner to resize it, freely. Off: its size is fixed.
; On is the default.
bFreeResize=1
; Resize style: 0 = Centred (an edge drag moves both sides about the middle), 1 = Edges (the dragged edge
; or corner moves and the opposite one stays put, like a normal window). Centred is the default.
; In every style the menu is kept inside the screen.
uResizeStyle=0
fNestedX=-1
fNestedY=-1
fNestedW=-1
fNestedH=-1
; The journal art the nested position was dragged under (panel = the game's own layout,
; qjo-redesign = Quest Journal Overhaul - Entire Journal Redesigned). Under any other art
; the position is ignored and the journal is measured afresh.
sNestedArt=
fHotkeyX=-1
fHotkeyY=-1
fHotkeyW=-1
fHotkeyH=-1

[Watchdog]
; If the menu renderer stops producing frames for uSeconds the game is treated as
; hung and closes itself - no Task Manager needed. 0 or bEnabled=0 disables it.
bEnabled=1
uSeconds=120

[FastExit]
; When the game exits, end the process at once instead of running every DLL's and
; driver's shutdown code - the phase where a closing game can get stuck beyond any kill.
; Saves and settings are written when you save or change them, not at exit. 0 disables.
bEnabled=1

[Log]
; 0 = trace, 1 = debug, 2 = info (the shipped default), 3 = warn, 4 = error, 5 = critical, 6 = off. Raise to 0 for a bug report.
uLogLevel=2

[MenuAlias]
; Player-facing names for mods' menu entries: <mod's registered name>=<what to show>.
; Set from the Framework Settings page; the mod itself is untouched.

[MenuOrder]
; 0 = alphabetical (the default), 1 = the custom sequence below.
bCustomOrder=0
; The custom sequence, pipe-separated, in list order. Typing a position number on
; the Framework Settings page rewrites this; mods missing from it insert at their
; alphabetical position.
sOrder=

[IniMenus]
; 1 = INI files directly in Data\SKSE\Plugins and in Data can have a page in this menu (the default). 0 = none do.
bEnabled=1
; The pages turned on one by one (Settings > Converted menus > INI), comma-separated. Each page starts off: empty = none shown.
sOn=

[MfmMenus]
; 1 = Mod Function Menu entries (the buttons other mods add under SKSE\Plugins\ccld_ModFunctionMenu) are a menu here,
; "Mod Function Menu" (the default). 0 = they are not. Mod Function Menu itself is not needed and not changed.
bEnabled=1

[TomlMenus]
; 1 = TOML files directly in Data\SKSE\Plugins and in its folders (Game Settings Override's among them) can be pages
; in this menu (the default). 0 = none are.
bEnabled=1
; The pages turned on one by one (Settings > Converted menus > TOML), comma-separated. Empty = none (each starts off).
sOn=

[ImGuiMenus]
; Other mods' own menus, opened from Framework > Other menus (this menu closes as one opens, and
; a mod's own key pressed while this menu is open closes it too). 1 = the mod's row is shown there when the mod is
; loaded - ENB: active in the game folder - (the default), 0 = it is not. Nothing of these mods is changed.
bOpenAnimationReplacer=1
bCommunityShaders=1
bImmersiveEquipmentDisplays=1
bOptiScaler=1
bENB=1

[Startup]
; Hold the screen black from the first frame the game draws until its main menu is
; up, so the logo frames and the half-drawn menu behind them are never shown. It
; lifts the moment play begins, or after uTimeoutSeconds if the main menu never
; appears, so a slow start can never leave you looking at nothing. 0 disables.
bBlackCurtain=1
; At game start, delete every <save>.amf-state.ini whose save is gone (nothing is deleted
; when the save folder holds no saves). 1 = on (the default), 0 = off.
bCleanOrphanedSaveState=1
; Seconds the curtain may stay up before it lifts anyway. It also lifts the moment
; play begins, so this only matters for a start that never reaches either.
uTimeoutSeconds=120

; A picture to show on the curtain instead of plain black.
;
; LEAVE IT EMPTY and the modlist's own splash art is used: Mod Organizer keeps splash.png in the
; root of its instance and Wabbajack lists ship one as their branding, so a list gets its own
; picture here without anyone setting a path. The file that was chosen is named in the log.
;
; Set a path, relative to Data, to use your own instead - for example
; SKSE\Plugins\ApocryphaMenuFramework\curtain.png. Set it to none for plain black.
;
; The picture is fitted to the screen with its shape kept, centred on black, and fades out with
; the curtain. PNG, JPEG and BMP are all read. If it cannot be loaded the curtain is simply
; black and the log says why, so a bad path never stops the game starting.
sCurtainImage=

[Theme]
; Registry id of the active theme: skyrim (the knotwork look), untarnished (plain),
; veldun (bone lines on warm brown, to sit beside Vel'dun UI), oathvein (grey lines,
; charcoal and blood red, to sit beside Oathvein UI), norden (slate lines and silver on
; Norden UI's grey) or norden-black (the same on black, to sit beside Norden UI - Black).
; Drop a theme INI into ApocryphaMenuFramework/themes to add your own; CUSTOM-MENU-ART.md
; lists the keys, and a theme's own art draws whenever that theme is picked.
sThemeId=skyrim

[Skin]
; Replacement ARTWORK for the menu shell, for a UI author matching their own
; interface. Every image is a 32-bit RGBA PNG - DDS is not decoded. All optional.
;
; bEnabled is the master switch and is OFF by default: with it off nothing below is
; even loaded and the menu keeps its built-in look, whatever the paths say. Turn it
; on only when you actually have artwork to point it at. There is a matching switch
; on the Framework Settings page, so it can be turned off without editing this file.
;   sFrame       one square PNG with a TRANSPARENT CENTRE, drawn as a nine-slice
;                around the window. 192x192 with 64px corners is a good default.
;   uFrameCorner how many pixels of that PNG are the corner ornament.
;   sBackground  a small tileable PNG (<=512px each side) OR a full-screen one -
;                which it is is decided by its own size, so both just work.
;   sPlates      a FOLDER holding any of toggle.png, slider.png, tab.png, to restyle
;                individual controls. Supply only the ones you want changed.
; Paths are under Data (Interface/YourMod/frame.png), or absolute while working.
bEnabled=0
sFrame=
uFrameCorner=64
sBackground=
sPlates=
